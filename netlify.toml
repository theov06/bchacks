# Netlify (hosting, spec T9). The sign-up form uses Netlify Forms; sponsor leads go to the
# team's Google Sheet (README "Sponsor form").
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24" # Astro needs >= 22.23.4; matches local dev

# v3.1: the sponsor page became the pop-up form on the home page.
[[redirects]]
  from = "/sponsor"
  to = "/#sponsors"
  status = 301
  force = true

[[redirects]]
  from = "/sponsor/"
  to = "/#sponsors"
  status = 301
  force = true
